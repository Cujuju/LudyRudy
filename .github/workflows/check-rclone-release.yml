name: Check rclone release

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check for a release without sending the webhook
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: check-rclone-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-rclone-release.mts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
          T3_RCLONE_WEBHOOK_URL: ${{ secrets.T3_RCLONE_WEBHOOK_URL }}
          T3_RCLONE_WEBHOOK_SECRET: ${{ secrets.T3_RCLONE_WEBHOOK_SECRET }}
